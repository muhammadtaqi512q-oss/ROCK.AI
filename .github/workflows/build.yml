name: Build Clean APK with Icon 

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Environment Manually
        run: |
          # Create Android SDK directory structure
          mkdir -p $HOME/android-sdk/cmdline-tools
          
          # Download official Command Line Tools (latest version)
          cd $HOME/android-sdk/cmdline-tools
          curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          
          # Export Environment Variables
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Licenses & Install Android Platforms
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # Accept licenses automatically
          yes | sdkmanager --licenses || true
          
          # Install required build tools and platforms
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          
          # 1. Create Cordova project
          cordova create app com.stickman11.velora "TINY FISHING"
          
          # 2. Clear default Cordova boilerplate files
          rm -rf app/www/*
          
          # 3. Copy ALL root web files safely into www/
          cp *.html app/www/ 2>/dev/null || true
          cp *.js app/www/ 2>/dev/null || true
          cp *.css app/www/ 2>/dev/null || true
          cp *.png app/www/ 2>/dev/null || true
          cp *.jpg app/www/ 2>/dev/null || true
          
          # Also copy game asset directories if they exist
          for dir in characters gun bg stage; do
            if [ -d "$dir" ]; then
              cp -r "$dir" app/www/
            fi
          done
          
          # 4. Add Custom Icon if present
          if [ -f "icon.png" ]; then
            cp icon.png app/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" \/>' app/config.xml
          fi
          
          # 5. Set Landscape Orientation in config.xml
          sed -i '/<\/widget>/i \    <preference name="Orientation" value="landscape" \/>' app/config.xml

          # 6. Add Android Platform & Build
          cd app
          export ANDROID_HOME=$HOME/android-sdk
          cordova platform add android
          
          # Fix Gradle executable permissions
          if [ -d "platforms/android" ]; then
            chmod +x platforms/android/gradlew || true
          fi

          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stickman-Shooter-GAME
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
